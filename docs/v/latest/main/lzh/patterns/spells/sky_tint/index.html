      <meta property="og:description" content="余於頂上為己攏就一方天色。受一顏色、一半徑、一以刻計之久、一濃淡之度，球心即余立身之所。余目所注落於球內，則天穹雲靄盡染其色；出於球外，天色於半徑六成之距內徐還本來。數染相疊，唯見其色最濃者一重，弗能渾融為一。濃淡之度，取零與一之間：零則漠然無覺，一則盡掩本然之天色。二者與半徑各為一事——半徑定所及天宇之廣，濃淡定所染之深。顏色以向徑給之，三分皆不過一者，依零至一解；不然，依零至二百五十五解；若止給一數，則為灰白之度。半徑至多二百五十六格，為時至多一萬二千刻，凡十分鐘也。是術乃人人自見之物：其色隨刻自盡；復入此世者，抑或後至之人，皆不見已然生效之染。霧靄、日月、星辰之明晦與天時，悉不為所動。媒質之損，計（0.5 + 半徑×0.1 + 秒之數×0.2）×（0.5 + 濃淡×0.5）之紫水玉粉。半徑十六格、歷三十秒、濃淡至滿，約耗紫水玉粉八數。" />
