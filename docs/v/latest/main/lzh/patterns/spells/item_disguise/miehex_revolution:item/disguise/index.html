      <meta property="og:description" content="余令一物貌似他物。受一實體，而易其貌。所易者，乃標的主手所執之物；若標的為委地之掉落物，則徑易其本身。儀貌所取，出於施法者副手之器。標的必在余法域之內。所易者，唯其貌耳。其物仍是本物：數目、耐久、附魔、燒煉之所得，一無所改；持之、納之箱篋、為漏斗所吸，亦皆如故。然其償不可免：既易其貌者，弗能與同類相疊，亦不為工作臺與鐵砧視作本物。此貌鐫於物之自身，世界識其本能，終不可欺。旁人立見其新貌，余視己手之物亦然；唯數目與耐久之條，仍以實告。耗紫水玉粉一數。" />
