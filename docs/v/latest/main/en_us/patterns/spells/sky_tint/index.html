      <meta property="og:description" content="I gather a sky of my own above my head. Accepts a color, a radius, a duration in ticks, and a strength; the sphere is centered where I stand. While my gaze falls within the sphere, the sky and the clouds are dyed that color; beyond it, the hue fades smoothly back to the original over a distance of 0.6 times the radius. Where several tints overlap, only the one with the deepest color shows — they never blend into one shade.Strength is a fraction from 0 to 1: at 0 it cannot be perceived at all, at 1 it covers the original sky entirely. It and the radius are two separate matters — the radius decides how much sky is touched, the strength decides how deeply it is dyed. The color is given as a vector; if all three components are at most 1 they are read as 0 to 1, otherwise as 0 to 255. A single number is read as grey. The radius may be at most 256 blocks, and the duration at most 12,000 ticks — ten minutes.This is a thing each observer sees for themselves: the tint ends by itself when its ticks run out, so one who logs back in, or who arrives only later, will not see a tint already in effect. Fog, the sun and moon, the brightness of the stars, and the weather are all untouched.Media cost is (0.5 + radius × 0.1 + seconds × 0.2) × (0.5 + strength × 0.5) amethyst dust. A radius of 16 blocks, held for 30 seconds at full strength, costs about 8 amethyst dust." />
