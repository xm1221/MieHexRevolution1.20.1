      <meta property="og:description" content="I make one thing look like another. Accepts an entity and gives it a new appearance. What is changed is the item in the target&#39;s main hand; if the target is a dropped item on the ground, then that item itself. The appearance is taken from the caster&#39;s offhand item. The target must lie within my ambit.Only the look of it is changed. It remains the same item: its count, durability, enchantments, and smelting yield are all unchanged, and picking it up, putting it in a chest, or letting a hopper draw it in all work as before.A price must be paid: a disguised item will not stack with others of its kind, nor will a crafting table or an anvil treat it as what it was. The disguise is engraved into the item itself; the world knows what it is by instinct, and cannot be fooled.Bystanders see the new appearance at once, and so do I when I look at my own hands; only the count and the durability bar still report the truth. Costs 1 amethyst dust." />
