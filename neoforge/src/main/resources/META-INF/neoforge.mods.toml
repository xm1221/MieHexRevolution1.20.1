type = "required"
versionRange = "[5,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.miehex_revolution]]
modId = "architectury"
type = "required"
versionRange = "[13,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.miehex_revolution]]
