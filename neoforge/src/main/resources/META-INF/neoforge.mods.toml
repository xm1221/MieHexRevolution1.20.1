modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "miehex_revolution"
version = "${version}"
displayName = "MieHex:Revolution"
authors = "xm1221"
description = "MieHex:Revolution addon for Hex Casting."

# FML 4 (NeoForge 1.21.1) requires mixin configs to be declared here; unlike Fabric's
# fabric.mod.json they are not picked up automatically.
[[mixins]]
config = "miehex_revolution-common.mixins.json"

[[dependencies.miehex_revolution]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.miehex_revolution]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.miehex_revolution]]
