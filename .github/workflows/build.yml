name: Build

on:
  push:
    branches:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: |
          set -o pipefail
          ./gradlew build --console=plain 2>&1 | tee build.log || {
            { grep -E "(^e: |^FAILURE:|^> Task .* FAILED|Execution failed|Could not |error:|Exception)" build.log || tail -n 8 build.log; } | head -n 8 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mod-build
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
          if-no-files-found: error
