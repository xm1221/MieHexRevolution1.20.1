# 自动发布 hexdoc 包到 PyPI
# 触发：push main（版本与 PyPI 最新不同时自动发布，相同则跳过）+ 手动 workflow_dispatch
# 认证：PyPI Trusted Publishing（OIDC）——pypi.org 项目设置里添加 trusted publisher：
#   owner=xm1221, repository=<本仓库>, workflow=publish.yml
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # PyPI Trusted Publishing 需要

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hexdoc-miehex-revolution
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v6
        with:
          activate-environment: true
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --no-dev

      # generated/* 被 gitignore。干净检出后直接 hatch/build 不会带上图案表，
      # 必须先让 hexdoc 导出资源，再打 wheel。
      # 本仓库没有 GitHub Pages，不设地址的话 hexdoc 会请求 /pages 并 404。
      - name: Export resources and build wheel
        env:
          GITHUB_PAGES_URL: https://hexbook.xm1221.cn/miehex-revolution
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run --auto-servernum uv run hexdoc ci build --no-release

      - name: Require pattern table in the wheel
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, sys, zipfile
          wheels = glob.glob("dist/*.whl")
          if len(wheels) != 1:
              sys.exit(f"expected one wheel, found {wheels}")
          with zipfile.ZipFile(wheels[0]) as z:
              hits = [n for n in z.namelist() if n.endswith(".patterns.hexdoc.json")]
          if not hits:
              sys.exit(f"{wheels[0]} has no patterns.hexdoc.json")
          print("pattern table:", ", ".join(hits))
          PY

      - name: Check if version already published on PyPI
        id: check
        run: |
          set -euo pipefail
          VER="$(basename "$(ls dist/*.whl)" | sed -E 's/^[^-]+-([^-]+)-py3.*/\1/')"
          LATEST="$(curl -s https://pypi.org/pypi/hexdoc-miehex-revolution/json | python3 -c 'import sys,json;print(json.load(sys.stdin)["info"]["version"])' 2>/dev/null || true)"
          if [ "$VER" = "$LATEST" ]; then
            echo "Version $VER already published on PyPI - skipping upload"
            echo "publish_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $VER not on PyPI (latest: ${LATEST:-none}) - will publish"
            echo "publish_needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package to PyPI
        if: steps.check.outputs.publish_needed == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: false
