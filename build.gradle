plugins {
    id 'dev.architectury.loom' version '1.13-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.gradleup.shadow' version '8.3.6' apply false
    id 'org.jetbrains.kotlin.jvm'
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'
    apply plugin: 'kotlin'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name-$minecraft_version"
    }

    repositories {
        // Reliable mod repos only — broken website "maven" URLs removed (caused POM parse failures).
        maven { url = "https://maven.neoforged.net/releases" }
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.architectury.dev/" }
        maven { url = "https://maven.blamejared.com/" }
        maven { url = "https://maven.hexxy.media" }
        maven { url = "https://api.modrinth.com/maven" }
        maven { url = "https://maven.shedaniel.me/" }
        maven { url = "https://maven.terraformersmc.com/releases" }
        maven { url = "https://maven.jamieswhiteshirt.com/libs-release/" }
        maven { url = "https://maven.kosmx.dev/" }
        maven { url = "https://maven.ladysnake.org/releases" }
        maven { url = "https://maven.minecraftforge.net/" }
        mavenCentral()
    }

    loom {
        silentMojangMappingsLicense()
    }
    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
        compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.0"))

        // Local jars from common/libs.
        //
        // The BlameJared CI jars are *not* uniformly mapped:
        //   - hexcasting-neoforge / paucal-neoforge / patchouli / inline are named (Mojang)
        //     mappings, so they go in as plain `implementation` (no Loom remap).
        //   - hexcasting-fabric / paucal-fabric / cloth-config-fabric are intermediary-mapped
        //     Fabric mods and must go through `modImplementation` so Loom remaps them to the
        //     dev (named) mappings. Adding them as plain `implementation` leaves `class_XXXX`
        //     references that the Kotlin compiler cannot resolve against the named MC jar.
        // The `*-common-*` Hex/PAUCAL artifacts are intermediary-mapped duplicates of the
        // platform jars and are never used (they shadow named classes).
        def libsDir = file("${rootProject.projectDir}/common/libs")

        if (project.name == 'neoforge') {
            implementation fileTree(dir: libsDir, include: [
                    'hexcasting-neoforge-*.jar',
                    'paucal-*-neoforge.jar',
                    'cloth-config-*-neoforge.jar',
                    'patchouli.jar',
                    'inline-neoforge-*.jar',
            ])
        } else if (project.name == 'fabric') {
            // Patchouli is not referenced from source (the book is plain data), so it is not
            // on the Fabric classpath at all.
            modImplementation fileTree(dir: libsDir, include: [
                    'hexcasting-fabric-*.jar',
                    'paucal-*-fabric.jar',
                    'cloth-config-*-fabric.jar',
            ])
        } else {
            // `common` compiles platform-neutrally: the Fabric variants are intermediary
            // jars, so Loom remaps them here as well (`modImplementation`).
            modImplementation fileTree(dir: libsDir, include: [
                    'hexcasting-fabric-*.jar',
                    'paucal-*-fabric.jar',
                    'cloth-config-*-fabric.jar',
            ])
        }
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}

    compileKotlin {
        kotlinOptions {
            jvmTarget = "21"
        }
    }
    compileTestKotlin {
        kotlinOptions {
            jvmTarget = "21"
        }
    }
